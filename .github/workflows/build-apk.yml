name: Build Android APK - بقالة العزي

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Generate Keystores if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -alias upload -keypass android -keystore my-upload-key.jks -storepass android -dname "CN=AlEzzi POS,O=AlEzzi,C=YE" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Optimized Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Package Artifacts
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apk/AlEzzi-Grocery-POS-v1.0.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlEzzi-Grocery-POS-v1.0
          path: output_apk/AlEzzi-Grocery-POS-v1.0.apk
          retention-days: 30
