name: Create Release - بقالة العزي

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    name: Generate Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Generate Keystores if Missing
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -alias upload -keypass android -keystore my-upload-key.jks -storepass android -dname "CN=AlEzzi POS,O=AlEzzi,C=YE" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_files
        run: |
          mkdir -p release_assets
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/AlEzzi-Grocery-POS-${TAG}.apk"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_files.outputs.tag }}
          name: "إصدار بقالة العزي للمواد الغذائية - ${{ steps.prepare_files.outputs.tag }}"
          body: |
            ### 🛒 بقالة العزي للمواد الغذائية - نظام إدارة الحسابات ونقاط البيع
            
            - **النسخة:** ${{ steps.prepare_files.outputs.tag }}
            - **حجم خفيف جداً:** ~ 1.7 ميجابايت فقط!
            - إدارة شاملة للعملاء، الديون، الفواتير، والمخزون.
            - دعم الطباعة الحرارية عبر البلوتوث (58 مم).
            - مشاركة الإيصالات وكشوف الحسابات عبر واتساب.
            - نظام محلي يعمل دون الحاجة إلى الإنترنت.
            
            يمكنك تحميل ملف الـ APK المرفق وتثبيته مباشرة على هاتفك الأندرويد.
          files: release_assets/*.apk
          draft: false
          prerelease: false
